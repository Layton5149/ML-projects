<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anime Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script type = "module" src = "{{ url_for('static', filename='index.js') }}"></script>
</head>
<body>
    <header class="bg-light py-4">
        <div class="container">
            <h1 class="text-center fw-bold mb-0">Anime Recommendation</h1>
        </div>
    </header>

    <main class="py-5">
        <div class="container">
            <form class="d-flex justify-content-center">
                <div class="flex-row" style="max-width:640px;">
                    <div class="flex-column mb-3">
                        <input type="search" class="form-control" placeholder="Search for a movie name..." id="search-text" />
                        <button class="btn btn-primary" type="submit" id = "searchBtn">Search</button>
                    </div>
                    <div id="suggestions" class="bg-white border d-none" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
            </form>
        </div>
        <div class="container mt-5" id="results"></div>

        </div>
    </main>
</body>
</html>
